<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Un juego para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:linear-gradient(#ffb0d8,#b57cff);color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:12px}
  #wrap{position:relative;width:100%;aspect-ratio:16/9;border:5px solid #ff8fc7;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #4a2a94,0 8px 0 3px #4a2a94,0 16px 24px rgba(40,10,70,.35)}
  canvas{width:100%;height:100%;display:block}
  #ov{position:absolute;inset:0;background:rgba(26,16,48,.6);display:flex;overflow-y:auto;touch-action:pan-y;padding:10px}
  #ov.hidden{display:none}
  #ovin{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:100%;background:#fff0f8;color:#4a2060;border:4px solid #ff5fa8;border-radius:18px;padding:14px 12px;box-shadow:0 5px 0 #b23578}
  #ov h1{font-size:clamp(15px,4.6vw,23px);margin:0;color:#ff3d8b;line-height:1.3;font-weight:700}
  #ov p{line-height:1.45;margin:0;max-width:94%;color:#4a2060;min-height:2em}
  button{font-family:inherit;font-weight:700;border:0;color:#fff}
  #ovbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .ob{background:linear-gradient(#ff8fc7,#ff4f9e);border:3px solid #b23578;font-size:clamp(13px,3.8vw,17px);padding:9px 20px;border-radius:999px;box-shadow:0 4px 0 #b23578;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .ob:active{transform:translateY(3px);box-shadow:0 1px 0 #b23578}
  #pad{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
  .dir,.acts{display:flex;gap:12px;align-items:center}
  .btn{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b99cff,#7b4bd6 70%);border:3px solid #4a2a94;font-size:26px;box-shadow:0 5px 0 #4a2a94;display:flex;align-items:center;justify-content:center}
  .btn.on{transform:translateY(4px);box-shadow:0 1px 0 #4a2a94}
  #jump{background:radial-gradient(circle at 35% 30%,#ffa8d4,#ff5fa8 70%);border-color:#b23578;box-shadow:0 5px 0 #b23578;width:88px;height:88px;font-size:15px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  #jump.on{box-shadow:0 1px 0 #b23578}
  #fire{background:linear-gradient(135deg,#ff5a5a,#ffd24a,#4fd36f,#4a9cff,#a35cff);box-shadow:0 5px 0 #4a2a94;width:64px;height:64px;font-size:24px;visibility:hidden}
  #fire.show{visibility:visible}
  #fire.on{transform:translateY(4px);box-shadow:0 1px 0 #4a2a94}
  #hintrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #hint{font-size:13px;color:#4a1a6c;line-height:1.3}
  #mute{background:#7b4bd6;border:3px solid #4a2a94;border-radius:10px;padding:6px 10px;font-size:16px;box-shadow:0 3px 0 #4a2a94}
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="c" width="640" height="360"></canvas>
    <div id="ov"><div id="ovin"><h1 id="ovt"></h1><p id="ovp"></p><div id="ovbtns"><button class="ob" id="ovbtn"></button><button class="ob" id="ovbtn2" style="display:none"></button></div></div></div>
  </div>
  <div id="pad">
    <div class="dir">
      <button class="btn" id="bl">◀</button>
      <button class="btn" id="br">▶</button>
    </div>
    <div class="acts">
      <button class="btn" id="fire">🌈</button>
      <button class="btn" id="jump">SALTAR</button>
    </div>
  </div>
  <div id="hintrow"><div id="hint">Golpea los bloques con la cabeza. Salta sobre los enemigos. Junta los 100 tulipanes.</div><button id="mute">🔊</button></div>
</div>

<script>
/* ========= PERSONALIZA AQUÍ ========= */
const NOMBRE = "Mi amor";      // cómo la llamas
const DE     = "Cristian";     // tu nombre

// Las 6 frases de los cofres (3 por nivel, de izquierda a derecha en cada nivel)
const FRASES = [
  /* cofre 1 (nivel 1) */ "Empieza mi regalo por estar en el mes 22 con mi bebé preciosa. Recoge cada cofre, en cada uno hay una frase para nosotros dos. Te amo mi bebé, ¡felices 22 meses!",
  /* cofre 2 (nivel 1) */ "Contigo hasta el silencio se siente bonito.",
  /* cofre 3 (nivel 1) */ "Eres mi lugar favorito en el mundo.",
  /* cofre 4 (nivel 2) */ "Si la vida fuera un juego, te elegiría en cada partida.",
  /* cofre 5 (nivel 2) */ "Gracias por hacerme sonreír en los días donde la distancia pega más duro, días en los que quiero estar pegado a ti y estamos tan lejos. Te amo.",
  /* cofre 6 (nivel 2) */ "Contigo quiero seguir festejando cada mes, como este que festejé ahora, inventándome algo nuevo para sacarte una sonrisa. Te amo con locura mi amor."
];

// Lo que suelta la cucaracha al ser derrotada
const MENSAJE_FINAL = "Llegaste al final, pero lo nuestro apenas está empezando, y eso que llevamos casi 2 años. Lo digo porque quiero pasar el resto de mi vida contigo. Te amo muchísimo mi preciosa. Gracias por ser mi mejor jugadora y mi compañera de aventuras.";
const PREGUNTA = "¿Quieres seguir siendo mi novia?";
const DESPEDIDA = "Felices 22 meses. Te amo.";
const MENSAJE_MONEDAS = "Gracias por escoger las 100 monedas. Estas 100 monedas no son tan valiosas como mi amor por ti. Te amo con toda mi vida.";
/* ===================================== */

const T = 16, W = 320, H = 180;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.setTransform(2,0,0,2,0,0);

/* enemies: ['n'|'s', col, filaSuperficie, colMin, colMax]  ·  ['f', col, yPixel, colMin, colMax]
   blocks:  [col, fila, 'egg'|'rain'|'heart'] */
const LEVELS = [
  { cols:100, theme:0, song:'day',
    ground:[[0,14],[17,30],[33,46],[49,62],[66,78],[81,99]],
    plats:[[8,6,3],[20,6,3],[24,4,3],[36,6,3],[40,4,3],[53,6,3],[57,4,3],[64,7,2],[70,6,3],[74,4,3],[86,6,3],[90,4,3]],
    chests:[[9,5],[41,3],[91,3]],
    blocks:[[5,6,'egg'],[28,6,'rain'],[45,6,'heart'],[60,6,'egg'],[68,6,'heart'],[84,6,'rain']],
    enemies:[['n',10,9,6,13],['n',20,9,18,29],['f',27,98,22,33],['s',37,9,34,45],['n',52,9,50,61],['f',56,96,50,62],
             ['n',68,9,67,77],['s',75,9,67,77],['f',72,92,67,78],['n',83,9,82,98],['s',93,9,82,98],['f',88,100,82,98]],
    goal:96 },
  { cols:120, theme:1, song:'night',
    ground:[[0,10],[13,22],[26,34],[38,47],[51,62],[66,76],[80,90],[94,119]],
    plats:[[5,6,3],[16,6,3],[20,4,3],[24,7,2],[29,6,3],[36,7,2],[41,6,3],[45,4,3],[49,7,2],[55,6,3],[59,4,3],[64,7,2],[69,6,3],[73,4,3],[78,7,2],[83,6,3],[87,4,3],[92,7,2]],
    chests:[[6,5],[21,3],[74,3]],
    blocks:[[4,6,'egg'],[14,6,'rain'],[32,6,'egg'],[52,6,'heart'],[67,6,'egg'],[96,6,'rain'],[98,6,'heart']],
    enemies:[['n',8,9,3,9],['s',18,9,13,21],['f',30,96,26,34],['n',33,9,27,33],['s',43,9,38,46],['f',48,92,44,56],
             ['n',58,9,51,61],['f',60,100,52,62],['s',70,9,66,75],['f',76,96,66,90],['n',84,9,80,89],['s',87,9,80,89]],
    goal:null, arena:{trig:101,min:102,max:120,start:112} }
];

let lvl = 0, L, grid, blocks, items, shots, chests, enemies, boss, hearts = 3, score = 0, cam = 0, toast = '', toastT = 0, paused = true, tick = 0, started = false;
let coinsL=[]; const COLL=[new Set(),new Set()];
const input = { left:false, right:false, jump:false, fire:false };
const P = { x:0, y:0, w:12, h:20, vx:0, vy:0, face:1, onGround:false, coyote:0, jumpHeld:false, anim:0, safeX:24, safeY:0, inv:0, kbT:0, kbDir:1, noCut:0, mounted:false, power:false, fireCD:0, fireHeld:false };

function loadLevel(i, keep){
  const prev = keep && chests ? chests.map(c=>c.open) : null;
  lvl = i; L = LEVELS[i]; if(i===0&&!keep){ score=0; COLL[0].clear(); COLL[1].clear(); }
  grid = [];
  for(let r=0;r<11;r++){ grid.push(new Array(L.cols).fill(0)); }
  L.ground.forEach(([a,b])=>{ for(let c=a;c<=b;c++){ grid[9][c]=1; grid[10][c]=2; } });
  L.plats.forEach(([x,y,w])=>{ for(let c=x;c<x+w;c++) grid[y][c]=3; });
  blocks = {};
  L.blocks.forEach(([c,r,kind])=>{ grid[r][c]=4; blocks[r+','+c]={kind,used:false}; });
  items = []; shots = [];
  chests = L.chests.map(([c,r],k)=>({c,r,k,open:prev?!!prev[k]:false}));
  enemies = L.enemies.map(makeEnemy);
  coinsL = genCoins().filter(k=>!COLL[i].has(k.id));
  boss = L.arena ? {x:L.arena.start*T,y:9*T-20,w:36,h:20,dir:-1,hp:3,active:false,inv:0,dead:false,done:false,deadT:0,anim:0,timer:0} : null;
  hearts = 3;
  P.mounted=false; P.power=false; P.w=12; P.h=20; P.fireCD=0;
  P.x = 24; P.y = 9*T - P.h - 1; P.vx = 0; P.vy = 0; P.safeX = 24; P.safeY = P.y; P.inv = 0; P.kbT = 0; P.noCut = 0; cam = 0;
  refreshFire();
  if(started) startMusic(L.song);
}

function genCoins(){
  const out=[], seen=new Set(), cc=new Set(chests.map(ch=>ch.r+','+ch.c));
  const ok=(c,r)=>r>=0&&r<9&&c>=0&&c<L.cols&&c!==L.goal&&grid[r][c]===0&&!cc.has(r+','+c)&&!seen.has(r+','+c);
  const add=(c,r)=>{ if(out.length<50&&ok(c,r)){ seen.add(r+','+c); out.push({c,r,id:c+','+r}); } };
  L.plats.forEach(([x,y,w])=>{ for(let c=x;c<x+w;c++) add(c,y-1); });
  const cand=[]; for(let c=2;c<L.cols-2;c++) if(grid[9][c]===1&&ok(c,8)) cand.push(c);
  const need=50-out.length; for(let i=0;i<need&&i<cand.length;i++) add(cand[Math.floor(i*cand.length/need)],8);
  return out;
}
function checkCoins(){ if(COLL[0].size+COLL[1].size===100){ jingle(); dialog('🌷 ¡100 monedas! 🌷', MENSAJE_MONEDAS, 'Seguir', null); } }
function makeEnemy(d,k){
  const t=d[0], c=d[1], r=d[2], a=d[3], b=d[4];
  const base={t,x:c*T,dir:(k%2?-1:1),min:a*T,max:(b+1)*T,alive:true,sq:0,inv:0};
  if(t==='f') return Object.assign(base,{y:r,y0:r,w:14,h:10,hp:1,ph:k*1.7,amp:12});
  if(t==='s') return Object.assign(base,{y:r*T-14,w:16,h:14,hp:2});
  return Object.assign(base,{y:r*T-12,w:14,h:12,hp:1});
}

function solid(c,r){
  if(r<0) return false;
  if(c<0 || c>=L.cols) return true;
  if(r>=11) return false;
  return grid[r][c] !== 0;
}
function hits(x,y){
  const c0=Math.floor(x/T), c1=Math.floor((x+P.w-0.01)/T);
  const r0=Math.floor(y/T), r1=Math.floor((y+P.h-0.01)/T);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(solid(c,r)) return true;
  return false;
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

/* ---- sonido y música ---- */
let ac, musicOn = true, song = null, stepI = 0, mTimer = null, curSong = null;
function ensureAC(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function tone(f,d,type,vol){
  if(!musicOn) return;
  try{
    ensureAC(); if(!ac) return;
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type=type||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
function beep(f,d,type){ tone(f,d,type,.05); }
function jingle(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.14),i*110)); }
const mtof = m => 440*Math.pow(2,(m-69)/12);
const N=null;
function build(step,prog,mels,w,bw,aw){
  const mel=[],bass=[],arp=[];
  prog.forEach(([r,q],i)=>{ const t=[0,q?3:4,7,12]; mels[i].forEach(m=>mel.push(m));
    for(let k=0;k<8;k++){ bass.push(k%2?N:r+[0,7,12,7][k>>1]); arp.push(r+12+t[[0,1,2,3,2,1,2,3][k]]); } });
  return {step,wave:w,bwave:bw,awave:aw,mel,bass,arp};
}
const SONGS = {
  day:build(.19,[[48,0],[45,1],[41,0],[43,0],[48,0],[45,1],[41,0],[43,0]],
    [[76,N,79,N,72,74,76,N],[81,N,79,76,72,N,76,N],[77,N,81,N,79,77,74,N],[79,N,83,N,81,79,74,N],
     [84,N,79,N,76,79,84,N],[81,N,84,81,76,N,72,N],[81,N,77,N,74,77,81,N],[79,77,74,N,71,N,74,N]],'triangle','sine','sine'),
  night:build(.26,[[45,1],[41,0],[48,0],[43,0],[45,1],[41,0],[48,0],[43,0]],
    [[81,N,N,76,77,N,76,N],[77,N,N,81,79,N,77,N],[79,N,N,76,72,N,76,N],[74,N,79,N,83,N,81,79],
     [81,N,84,N,83,N,81,N],[81,N,77,N,72,N,77,N],[76,N,79,N,84,N,79,N],[83,N,79,N,74,N,N,N]],'triangle','sine','sine'),
  boss:{ step:.15, wave:'sawtooth', bwave:'square',
    mel:[69,N,69,72, 69,N,75,N,  68,N,68,71, 68,N,74,N,  69,N,69,72, 69,N,75,N,  72,71,70,69, 68,N,N,N],
    bass:[45,N,45,N, 45,N,45,45, 44,N,44,N, 44,N,44,44, 45,N,45,N, 45,N,45,45, 41,N,41,N, 40,N,40,40] }
};
function stopMusic(){ clearTimeout(mTimer); mTimer=null; song=null; }
function startMusic(name){
  stopMusic(); curSong=name; song=SONGS[name]; stepI=0;
  if(!musicOn || !song) return;
  musicTick();
}
function musicTick(){
  if(!song) return;
  const s=stepI%song.mel.length;
  if(song.mel[s]!=null) tone(mtof(song.mel[s]),song.step*(song.awave?1.4:0.9),song.wave,song.awave?0.07:0.028);
  if(song.arp&&song.arp[s]!=null) tone(mtof(song.arp[s]),song.step*1.1,song.awave,0.02);
  if(song.bass[s]!=null) tone(mtof(song.bass[s]),song.step*1.7,song.bwave,song.awave?0.1:0.06);
  stepI++;
  mTimer=setTimeout(musicTick,song.step*1000);
}
document.getElementById('mute').addEventListener('click',()=>{
  musicOn=!musicOn;
  document.getElementById('mute').textContent=musicOn?'🔊':'🔇';
  if(!musicOn) stopMusic(); else if(started && curSong) startMusic(curSong);
});

/* ---- diálogos ---- */
const ov=document.getElementById('ov'), ovt=document.getElementById('ovt'), ovp=document.getElementById('ovp');
const ovbtn=document.getElementById('ovbtn'), ovbtn2=document.getElementById('ovbtn2');
let typer=null, ovCb=null, ovCb2=null;
function dialog(title,text,label,cb,label2,cb2){
  paused=true; input.left=input.right=input.jump=input.fire=false; syncBtns();
  ovt.textContent=title; ovp.textContent=''; ovbtn.textContent=label; ovCb=cb;
  ovbtn2.style.display=label2?'':'none'; if(label2) ovbtn2.textContent=label2; ovCb2=cb2||null;
  const n=text.length;
  ovp.style.fontSize = n>200?'clamp(11px,3.2vw,15px)':(n>110?'clamp(12px,3.6vw,17px)':'clamp(13px,4vw,19px)');
  ov.classList.remove('hidden');
  clearInterval(typer); let i=0;
  typer=setInterval(()=>{ ovp.textContent=text.slice(0,++i); if(i>=text.length) clearInterval(typer); },26);
  ovp.dataset.full=text;
}
function press(which){
  if(ovp.textContent.length < (ovp.dataset.full||'').length){ clearInterval(typer); ovp.textContent=ovp.dataset.full; return; }
  ov.classList.add('hidden'); clearInterval(typer);
  paused=false;
  const cb = which===2 ? ovCb2 : ovCb;
  ovCb=null; ovCb2=null; if(cb) cb();
}
ovbtn.addEventListener('click',()=>press(1));
ovbtn2.addEventListener('click',()=>press(2));

function opened(){ return chests.filter(c=>c.open).length; }

function openChest(ch){
  ch.open=true; score+=500; jingle();
  dialog('💌 Cofre '+(ch.k+1)+'/3', FRASES[lvl*3+ch.k], 'Seguir', null);
}

function reachGoal(){
  if(opened()<chests.length){ toast='Faltan cofres'; toastT=100; return; }
  jingle();
  dialog('¡Nivel 1 listo!', 'Muy bien, '+NOMBRE+'. Ahora viene el nivel 2, de noche y con estrellas. Cuidado: al final te espera un jefe.', 'Nivel 2', ()=>loadLevel(1));
}

function finalSeq(){
  dialog('💌 La cucaracha soltó una carta', MENSAJE_FINAL+' — '+DE, 'Seguir', ()=>{
    dialog('💍', PREGUNTA, '¡Sí! 💖', ending, 'Sí, mil veces 💖', ending);
  });
}
function ending(){
  jingle();
  dialog('💖 Felices 22 meses 💖', DESPEDIDA+' — '+DE, 'Jugar otra vez', ()=>loadLevel(0));
}

/* ---- jugadora: montar / desmontar ---- */
function mount(){
  const bottom=P.y+P.h, cx=P.x+P.w/2;
  for(const o of [0,-5,5,-9,9,-14,14]){
    const nx=cx-11+o, ny=bottom-22;
    P.w=22; P.h=22;
    if(nx>=0 && nx+22<=L.cols*T && !hits(nx,ny)){ P.x=nx; P.y=ny; P.mounted=true; return true; }
  }
  P.w=12; P.h=20; return false;
}
function dismount(){
  const bottom=P.y+P.h, cx=P.x+P.w/2;
  P.mounted=false; P.w=12; P.h=20; P.x=cx-6; P.y=bottom-20;
}
function refreshFire(){ document.getElementById('fire').classList.toggle('show',!!P.power); }

function hurt(cx){
  if(P.inv>0) return;
  P.inv=90; P.vy=-3.5; P.onGround=false; P.kbT=12; P.kbDir=(P.x+P.w/2<cx)?-1:1;
  beep(150,.25,'sawtooth');
  if(P.mounted){ dismount(); return; }
  hearts--;
  if(hearts<=0){
    dialog('Ay, no... 💔','Esos bichitos son traviesos. Tú puedes, inténtalo otra vez. Los cofres que abriste se quedan abiertos.','Reintentar',()=>loadLevel(lvl,true));
  }
}

function damageEnemy(e){
  e.hp--;
  if(e.hp<=0){ e.alive=false; e.sq=20; score+=100; beep(700,.08); }
  else { e.inv=40; beep(420,.1); }
}
function damageBoss(){
  boss.hp--; score+=300; boss.inv=70; beep(300,.15);
  if(boss.hp<=0){ boss.dead=true; boss.deadT=110; stopMusic(); jingle(); }
}

/* ---- controles ---- */
function syncBtns(){
  document.getElementById('bl').classList.toggle('on',input.left);
  document.getElementById('br').classList.toggle('on',input.right);
  document.getElementById('jump').classList.toggle('on',input.jump);
  document.getElementById('fire').classList.toggle('on',input.fire);
}
function bind(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault(); input[key]=true; syncBtns();};
  const off=e=>{e.preventDefault(); input[key]=false; syncBtns();};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bind('bl','left'); bind('br','right'); bind('jump','jump'); bind('fire','fire');
const keymap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'jump',w:'jump',' ':'jump',x:'fire',z:'fire'};
addEventListener('keydown',e=>{const k=keymap[e.key]; if(k){input[k]=true;syncBtns();e.preventDefault();}});
addEventListener('keyup',e=>{const k=keymap[e.key]; if(k){input[k]=false;syncBtns();e.preventDefault();}});

/* ---- bloques ---- */
function hitBlock(c,r){
  const b=blocks[r+','+c];
  if(!b || b.used) return;
  b.used=true; b.t0=performance.now(); grid[r][c]=5; score+=50;
  items.push({kind:b.kind,x:c*T+2,y:r*T,w:12,h:12,pop:12});
  beep(260,.08);
}

/* ---- lógica ---- */
function update(){
  if(paused) return;
  tick++;
  const ax=(input.right?1:0)-(input.left?1:0);
  if(P.kbT>0){ P.kbT--; P.vx=P.kbDir*2; } else { P.vx=ax*1.7; if(ax) P.face=ax; }

  if(P.onGround) P.coyote=6; else if(P.coyote>0) P.coyote--;
  if(input.jump && !P.jumpHeld && P.coyote>0){ P.vy=-5.8; P.onGround=false; P.coyote=0; beep(520,.08); }
  P.jumpHeld=input.jump;
  if(P.noCut>0) P.noCut--;
  else if(!input.jump && P.vy<-2.5) P.vy=-2.5;

  P.vy=Math.min(P.vy+0.28,6);

  // X
  P.x+=P.vx;
  if(P.x<0) P.x=0;
  if(P.x>L.cols*T-P.w) P.x=L.cols*T-P.w;
  if(hits(P.x,P.y)){
    if(P.vx>0){ const c=Math.floor((P.x+P.w-0.01)/T); P.x=c*T-P.w; }
    else if(P.vx<0){ const c=Math.floor(P.x/T); P.x=(c+1)*T; }
  }
  // Y
  P.y+=P.vy; P.onGround=false;
  if(hits(P.x,P.y)){
    if(P.vy>0){ const r=Math.floor((P.y+P.h-0.01)/T); P.y=r*T-P.h; P.onGround=true; }
    else if(P.vy<0){
      const r=Math.floor(P.y/T);
      if(r>=0 && r<11){
        const ca=Math.floor(P.x/T), cb=Math.floor((P.x+P.w-0.01)/T), mid=(P.x+P.w/2)/T;
        let best=-1, bd=99;
        for(let c=ca;c<=cb;c++){ if(grid[r][c]===4){ const d=Math.abs(c+0.5-mid); if(d<bd){bd=d;best=c;} } }
        if(best>=0) hitBlock(best,r);
      }
      P.y=(r+1)*T;
    }
    P.vy=0;
  }
  if(P.onGround){
    P.anim+=Math.abs(P.vx)*0.12;
    const fy=Math.floor((P.y+P.h+1)/T);
    if(solid(Math.floor((P.x-8)/T),fy) && solid(Math.floor((P.x+P.w+8)/T),fy)){ P.safeX=P.x; P.safeY=P.y; }
  }
  // caída
  if(P.y>H+40){ P.x=P.safeX; P.y=P.safeY; P.vx=0; P.vy=0; beep(180,.2,'sawtooth'); }

  if(P.inv>0) P.inv--;

  // objetos de los bloques
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.pop>0){ it.pop--; it.y-=1; continue; }
    if(overlap(P,it)){
      items.splice(i,1);
      if(it.kind==='egg'){
        if(!P.mounted){ if(mount()){ jingle(); toast='Montas un unicornio'; toastT=110; } else { items.push(it); } }
        else if(hearts<3){ hearts++; beep(880,.1); }
      } else if(it.kind==='rain'){
        P.power=true; refreshFire(); jingle(); toast='Poder arcoiris'; toastT=110;
      } else if(it.kind==='heart'){
        if(hearts<3) hearts++; beep(880,.12); beep(1175,.12);
      }
    }
  }

  for(let i=coinsL.length-1;i>=0;i--){ const k=coinsL[i], cx=k.c*T+8, cy=k.r*T+8;
    if(P.x<cx+6&&P.x+P.w>cx-6&&P.y<cy+7&&P.y+P.h>cy-7){ coinsL.splice(i,1); COLL[lvl].add(k.id); score+=10; beep(1318,.05); beep(1760,.09); checkCoins(); } }
  // disparo arcoíris
  if(P.fireCD>0) P.fireCD--;
  if(input.fire && !P.fireHeld && P.power && P.fireCD===0 && shots.length<3){
    shots.push({x:P.face>0?P.x+P.w:P.x-6, y:P.y+P.h/2-3, w:6, h:6, vx:P.face*3.4, life:80});
    P.fireCD=16; beep(900,.06,'triangle');
  }
  P.fireHeld=input.fire;
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i]; s.x+=s.vx; s.life--;
    let dead = s.life<=0 || s.x<0 || s.x>L.cols*T || solid(Math.floor((s.x+3)/T),Math.floor((s.y+3)/T));
    if(!dead){
      for(const e of enemies){
        if(e.alive && e.inv===0 && overlap(s,e)){ damageEnemy(e); dead=true; break; }
      }
    }
    if(!dead && boss && boss.active && !boss.dead && boss.inv===0 && overlap(s,boss)){ damageBoss(); dead=true; }
    if(dead) shots.splice(i,1);
  }

  // cofres
  for(const ch of chests){
    if(!ch.open && P.x<ch.c*T+T && P.x+P.w>ch.c*T && P.y<ch.r*T+T && P.y+P.h>ch.r*T){ openChest(ch); break; }
  }

  // enemigos
  for(const e of enemies){
    if(!e.alive){ if(e.sq>0) e.sq--; continue; }
    if(e.inv>0) e.inv--;
    const sp = e.t==='s'?0.5:(e.t==='f'?0.7:0.6);
    e.x+=e.dir*sp;
    if(e.x<=e.min){ e.x=e.min; e.dir=1; }
    if(e.x+e.w>=e.max){ e.x=e.max-e.w; e.dir=-1; }
    if(e.t==='f') e.y=e.y0+Math.sin(tick*0.05+e.ph)*e.amp;
    if(e.inv===0 && overlap(P,e)){
      if(P.vy>0 && P.y+P.h-P.vy<=e.y+6){ damageEnemy(e); P.vy=-4.8; P.noCut=8; P.onGround=false; }
      else hurt(e.x+e.w/2);
    }
  }

  // jefe cucaracha
  if(boss){
    const A=L.arena;
    if(!boss.active && P.x>A.trig*T+8){ boss.active=true; startMusic('boss'); }
    if(boss.active && !boss.dead){
      boss.anim+=0.2;
      if(boss.inv>0) boss.inv--;
      boss.timer++;
      if(boss.timer%80===0) boss.dir=(P.x+P.w/2>boss.x+boss.w/2)?1:-1;
      const sp=0.8+(3-boss.hp)*0.45;
      boss.x+=boss.dir*sp;
      if(boss.x<A.min*T){ boss.x=A.min*T; boss.dir=1; }
      if(boss.x+boss.w>A.max*T){ boss.x=A.max*T-boss.w; boss.dir=-1; }
      if(overlap(P,boss)){
        if(P.vy>0 && P.y+P.h-P.vy<=boss.y+6){
          if(boss.inv===0) damageBoss();
          P.vy=-5.6; P.noCut=8; P.onGround=false;
        } else if(boss.inv===0) hurt(boss.x+boss.w/2);
      }
    } else if(boss.dead && !boss.done){
      boss.deadT--;
      if(boss.deadT<=0){ boss.done=true; finalSeq(); }
    }
  }

  // meta (nivel 1)
  if(L.goal!=null){
    const gx=L.goal*T;
    if(P.x<gx+T && P.x+P.w>gx && P.y+P.h>4*T && P.y<9*T) reachGoal();
  }

  cam=Math.max(0,Math.min(P.x+P.w/2-W/2,L.cols*T-W));
  if(toastT>0) toastT--;
}

  } else {
    const fl=Math.sin(tick*.6)*3;
    E(-4,-10-fl*.5,3.6,2.2+Math.abs(fl)*.3,'rgba(255,255,255,.85)',1,-.5); E(4,-10-fl*.5,3.6,2.2+Math.abs(fl)*.3,'rgba(255,255,255,.85)',1,.5);
    E(0,-5,6.5,4.8,G(0,-10,0,0,'#ffe680','#e0a020')); E(-1.5,-5,1.3,4.6,'#3b1d09',0); E(2,-5,1.3,4.4,'#3b1d09',0);
    E(2.8*d,-6,1.5,1.9,'#fff'); E(3.1*d,-5.8,.7,1,'#222',0); E(-6.5*d,-4,1.2,.9,'#3b1d09');
  }
  ctx.restore();
}

function drawBoss(){
  if(!boss) return;
  const x=Math.round(boss.x-cam), y=Math.round(boss.y);
  if(!boss.dead && boss.inv>0 && Math.floor(boss.inv/4)%2===0) return;
  ctx.save();
  if(boss.dead){ ctx.translate(0,y*2+boss.h); ctx.scale(1,-1); }
  if(boss.dir<0){ ctx.translate(x*2+boss.w,0); ctx.scale(-1,1); }
  const o=Math.sin(boss.anim*2.2), wig=boss.dead?(Math.floor(Date.now()/80)%2?2:-2):0;
  ctx.strokeStyle='#2a1405'; ctx.lineWidth=1.5; ctx.lineCap='round'; ctx.beginPath();
  for(let i=0;i<3;i++){ const lx=x+9+i*7, k=(i%2?o:-o)*2.2; ctx.moveTo(lx,y+14); ctx.lineTo(lx+k+wig,y+20); ctx.moveTo(lx+2,y+14); ctx.lineTo(lx+2-k-wig,y+20); }
  const an=Math.sin(boss.anim*1.5)*2; ctx.moveTo(x+33,y+8); ctx.quadraticCurveTo(x+37,y+1,x+40+an,y+2); ctx.moveTo(x+31,y+7); ctx.quadraticCurveTo(x+34,y-1,x+38+an,y-1); ctx.stroke();
  E(x+16,y+10,15,8.5,G(0,y+2,0,y+18,'#9a5a2a','#4a2410'));
  ctx.strokeStyle='#2a1405'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x+16,y+3); ctx.lineTo(x+16,y+17.5); ctx.stroke();
  E(x+10,y+6,6,1.8,'rgba(255,255,255,.35)',0,-.1);
  E(x+30,y+11,6,5.5,G(0,y+5,0,y+16,'#6a3a18','#3b1d09'));
  E(x+32,y+9.5,2.4,2.6,'#fff'); E(x+32.7,y+9.8,1.1,1.5,'#c01818',0);
  ctx.strokeStyle=OL; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x+29.5,y+14); ctx.quadraticCurveTo(x+32,y+15.5,x+34,y+13.5); ctx.stroke();
  ctx.restore();
}

function drawShot(s){
  const x=Math.round(s.x-cam), y=Math.round(s.y);
  for(let i=0;i<6;i++) R(RB[i],x,y+i,6,1);
  ctx.globalAlpha=.45;
  for(let i=0;i<6;i++) R(RB[i],x-(s.vx>0?5:-6),y+i,5,1);
  ctx.globalAlpha=1;
}

function girl(){
  const run=P.onGround&&Math.abs(P.vx)>0, st=run?Math.sin(P.anim*2.2):0, air=!P.onGround;
  const tl=Math.sin(Date.now()/130)*1.4+(air?-2:0)+(run?-1.5:0);
  E(-6+tl*.3,-15+tl*.25,2.4,4.2,'#5a2d12',1,.4);
  E(-3.2+(air?1.5:st*2.6),-1.6,3.2,2.1,G(0,-3,0,0,'#a77cf0','#6a3fc8'));
  E(3.2+(air?-1.5:-st*2.6),-1.6,3.2,2.1,G(0,-3,0,0,'#a77cf0','#6a3fc8'));
  RR(-4.6,-13,9.2,9,3.5,G(0,-13,0,-4,'#ff7cb8','#e8307f'));
  E(0,-5.2,6.4,3.2,G(0,-8,0,-2,'#ff6aae','#e0287a'));
  E(3.6,-9.5+(run?st*.8:0),1.8,2.6,'#ffd2b5');
  E(0,-15.5,5.4,5.2,G(0,-21,0,-10,'#ffe3cd','#f5b995'));
  E(-.4,-18.3,5.8,3.5,G(0,-22,0,-15,'#8a4a22','#4e2610')); E(-3.6,-14.6,1.7,3.4,'#5a2d12',0);
  E(2.6,-15.2,1.1,1.7,OL,0); E(3,-15.9,.45,.6,'#fff',0); E(3.7,-13.2,1.3,.8,'rgba(255,90,140,.55)',0);
  E(-2.6,-20.6,2.3,1.4,'#ff3d8b');
}
function unicorn(){
  const run=P.onGround&&Math.abs(P.vx)>0, st=run?Math.sin(P.anim*2.2)*3:(P.onGround?0:2.5), tl=Math.sin(Date.now()/160);
  const W1=G(0,-14,0,-3,'#ffffff','#e3d6fb');
  const leg=(lx,k,c)=>{ ctx.save(); ctx.translate(lx,-7); ctx.rotate(k*.07); RR(-.9,0,1.8,7,.9,c); RR(-1,5.6,2,1.5,.7,'#ffb0d8',0); ctx.restore(); };
  ctx.beginPath(); ctx.moveTo(-7,-11); ctx.bezierCurveTo(-13,-13+tl*2,-14,-6,-12+tl*2,-2); ctx.bezierCurveTo(-10,-6,-9,-8,-6.5,-8); ctx.closePath();
  ctx.fillStyle=G(-14,-12,-8,-2,'#ff8fc7','#c9b6ff'); ctx.fill(); ctx.lineWidth=1.1; ctx.strokeStyle=OL; ctx.stroke();
  leg(-5.5,st,'#d8c8f5'); leg(5,-st,'#d8c8f5');
  E(-.5,-9.5,8.2,3.9,W1,1,-.08); E(5.2,-10.5,3.4,3.8,W1,0);
  leg(-3.5,-st,'#ffffff'); leg(7,st,'#ffffff');
  ctx.save(); ctx.translate(-1,-12.5); ctx.scale(.72,.72); girl(); ctx.restore();
  for(let i=0;i<4;i++) E(6.2-i*.9+Math.sin(Date.now()/200+i)*.5,-20+i*3.2,1.9,2.6,i%2?'#c9b6ff':'#ff8fc7',1,.25);
  ctx.beginPath(); ctx.moveTo(3.5,-8); ctx.quadraticCurveTo(6,-14,6.5,-19.5); ctx.lineTo(10.5,-18.5); ctx.quadraticCurveTo(10,-12,8.8,-8); ctx.closePath();
  ctx.fillStyle=W1; ctx.fill(); ctx.lineWidth=1.2; ctx.strokeStyle=OL; ctx.stroke();
  E(11,-19.2,4.2,2.3,W1,1,.45); E(14,-17.9,.35,.35,'#d8a0c0',0);
  ctx.beginPath(); ctx.moveTo(7.6,-21); ctx.lineTo(7.6,-24); ctx.lineTo(9.6,-21.6); ctx.closePath(); ctx.fillStyle='#f5ecff'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9.2,-21.3); ctx.lineTo(10.6,-27.5); ctx.lineTo(11.2,-21.3); ctx.closePath(); ctx.fillStyle=G(0,-27,0,-21,'#fff2a0','#e0a020'); ctx.fill(); ctx.stroke();
  E(10.7,-19.9,.7,.9,OL,0); E(10.9,-20.2,.25,.3,'#fff',0); E(9.4,-21.2,1.7,1.8,'#ff8fc7',1);
}
function drawPlayer(){
  if(P.inv>0 && Math.floor(P.inv/4)%2===0) return;
  const air=!P.onGround, bob=(P.onGround&&Math.abs(P.vx)>0)?Math.abs(Math.sin(P.anim*2.2))*1.2:0;
  const sy=air?(P.vy<0?1.1:.95):1, sx=air?(P.vy<0?.92:1.05):1;
  ctx.save(); ctx.translate(Math.round(P.x-cam+P.w/2),Math.round(P.y+P.h-bob)); ctx.scale((P.face<0?-1:1)*sx,sy);
  if(P.mounted) unicorn(); else girl();
  ctx.restore();
}

function tulip(x,y,k){
  ctx.save(); ctx.translate(x,y); ctx.scale(k,1);
  ctx.strokeStyle='#2f9a3a'; ctx.lineWidth=1.5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,7); ctx.lineTo(0,0); ctx.stroke();
  E(-2.8,4.2,3,1.1,'#4fd36f',1,-.6); E(2.8,4.2,3,1.1,'#4fd36f',1,.6);
  ctx.beginPath(); ctx.moveTo(-4.4,-6.5); ctx.lineTo(-4.6,-1.5); ctx.quadraticCurveTo(0,4,4.6,-1.5); ctx.lineTo(4.4,-6.5); ctx.lineTo(2.2,-4); ctx.lineTo(0,-7); ctx.lineTo(-2.2,-4); ctx.closePath();
  ctx.fillStyle=G(0,-7,0,3,'#ff9ccb','#e8307f'); ctx.fill(); ctx.lineWidth=1.2; ctx.strokeStyle=OL; ctx.stroke();
  E(-2.2,-2.2,.9,1.7,'rgba(255,255,255,.65)',0); ctx.restore();
}
function drawCoins(){ coinsL.forEach(k=>{ const x=k.c*T+8-Math.round(cam); if(x<-10||x>W+10) return; tulip(x,k.r*T+8+Math.sin(tick*.08+k.c)*1.6,.78+.22*Math.abs(Math.cos(tick*.045+k.c))); }); }
function txt(s,x,y,sz,al,col){
  ctx.font='700 '+sz+"px Fredoka, sans-serif"; ctx.textAlign=al||'left'; ctx.textBaseline='top';
  ctx.lineJoin='round'; ctx.lineWidth=3; ctx.strokeStyle='#14233f'; ctx.strokeText(s,x,y);
  ctx.fillStyle=col||'#fff'; ctx.fillText(s,x,y);
}
function drawHUD(){
  pix(HEART,5,6,'#14233f',2); pix(HEART,6,7,'#ff3d8b',2); txt('x'+hearts,24,5,11);
  R('#14233f',5,21,14,12); R('#8a4b1f',6,24,12,8); R('#ffd24a',6,27,12,2); R('#b86a2e',6,22,12,4);
  txt(opened()+'/'+chests.length,24,21,11);
  tulip(11,43,1); txt((COLL[0].size+COLL[1].size)+'/100',24,37,11);
  if(P.power){ for(let i=0;i<6;i++) R(RB[i],6,55+i,14,1); }
  txt(String(score).padStart(8,'0'),W-6,5,11,'right');
  txt('NIVEL '+(lvl+1),W-6,21,10,'right','#ffe680');
  if(boss && boss.active && !boss.dead){
    txt('CUCARACHA',160,6,10,'center');
    for(let i=0;i<3;i++){ R('#14233f',106+i*36,19,35,8); R(i<boss.hp?'#e03030':'#5a6a8a',107+i*36,20,33,6); }
  }
  if(toastT>0){
    ctx.fillStyle='rgba(20,35,63,.75)'; ctx.fillRect(50,64,220,22);
    txt(toast.toUpperCase(),160,68,11,'center','#ffe680');
  }
}

function draw(){
  drawBG(); items.forEach(drawItem); drawTiles(); drawCoins(); chests.forEach(drawChest); drawGoal(); enemies.forEach(drawEnemy); drawBoss(); shots.forEach(drawShot); drawPlayer(); drawHUD();
}

/* ---- bucle ---- */
let last=performance.now(), acc=0;
function loop(t){
  acc+=Math.min(t-last,100); last=t;
  while(acc>=16.67){ update(); acc-=16.67; }
  draw(); requestAnimationFrame(loop);
}

loadLevel(0);
dialog('💖 Para '+NOMBRE+' 💖','Un juego hecho por '+DE+'. Golpea los bloques con la cabeza, abre los cofres, salta sobre los enemigos y llega hasta el final.','Jugar',()=>{ started=true; ensureAC(); startMusic(L.song); });
requestAnimationFrame(loop);
</script>
